<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lightbox — Asset Review</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e; color: #ccc; font-family: 'Courier New', monospace; padding: 24px;
  }
  a { color: #6faaff; text-decoration: none; }
  a:hover { text-decoration: underline; }

  h1 { color: #eee; font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 13px; margin-bottom: 24px; }

  /* Background toggle bar */
  .bg-toggle {
    display: flex; gap: 8px; align-items: center; margin-bottom: 24px;
    font-size: 13px; color: #888;
  }
  .bg-toggle button {
    background: #333; border: 1px solid #555; color: #ccc; padding: 4px 12px;
    border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px;
  }
  .bg-toggle button.active { background: #6faaff; color: #111; border-color: #6faaff; }

  /* Experiment section */
  .experiment {
    margin-bottom: 40px; border-bottom: 1px solid #2a2a4e; padding-bottom: 32px;
  }
  .experiment:last-child { border-bottom: none; }
  .experiment-header {
    margin-bottom: 16px;
  }
  .experiment-name {
    font-size: 22px; color: #eee; font-weight: bold;
  }
  .experiment-id {
    font-size: 14px; color: #6faaff; margin-top: 2px;
  }
  .experiment-notes {
    font-size: 12px; color: #aaa; margin-top: 6px; line-height: 1.4;
  }
  .experiment-type {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 3px;
    margin-left: 8px; vertical-align: middle;
  }
  .type-static { background: #2a4a2a; color: #8f8; }
  .type-directional { background: #4a3a2a; color: #fa8; }
  .type-animation { background: #2a3a4a; color: #8cf; }

  /* Zoom row: all zoom levels side by side */
  .zoom-row {
    display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap;
  }
  .zoom-item {
    display: flex; flex-direction: column; align-items: center;
  }
  .zoom-label {
    font-size: 11px; color: #888; margin-bottom: 4px;
  }
  .zoom-img {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
  .preview-bg {
    border: 1px solid #333; border-radius: 4px; padding: 4px;
    display: inline-block; line-height: 0;
  }

  /* Checkerboard pattern via CSS */
  .bg-checker {
    background-image:
      linear-gradient(45deg, #999 25%, transparent 25%),
      linear-gradient(-45deg, #999 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #999 75%),
      linear-gradient(-45deg, transparent 75%, #999 75%);
    background-size: 8px 8px;
    background-position: 0 0, 0 4px, 4px -4px, -4px 0px;
    background-color: #ccc;
  }

  /* Compass grid for directional previews */
  .compass-container {
    display: flex; flex-direction: column; gap: 16px;
  }
  .compass-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 8px;
    max-width: 520px;
  }
  .compass-cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60px;
  }
  .compass-cell.empty { /* empty grid cells */ }
  .compass-label {
    font-size: 11px; color: #888; margin-bottom: 4px; text-transform: uppercase;
  }
  .compass-cell .preview-bg {
    transition: outline-color 0.15s;
    outline: 2px solid transparent;
    outline-offset: 2px;
  }
  .compass-cell.active .preview-bg {
    outline-color: #6faaff;
  }
  .compass-cell.active .compass-label {
    color: #6faaff; font-weight: bold;
  }
  .compass-img {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
  .compass-controls {
    display: flex; gap: 8px; align-items: center; font-size: 13px; color: #888;
  }
  .compass-controls button {
    background: #333; border: 1px solid #555; color: #ccc; padding: 4px 14px;
    border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px;
  }
  .compass-controls button.active { background: #6faaff; color: #111; border-color: #6faaff; }

  /* Placeholder for unknown types */
  .placeholder {
    background: #16213e; border: 1px solid #333; border-radius: 8px;
    padding: 24px; color: #666; font-size: 13px;
  }

  /* Animation player */
  .anim-container {
    display: flex; flex-direction: column; gap: 12px;
  }
  .anim-main {
    display: flex; align-items: center; gap: 16px;
  }
  .anim-main .preview-bg {
    line-height: 0;
  }
  .anim-main-img {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
  .anim-controls {
    display: flex; gap: 12px; align-items: center; font-size: 13px; color: #888;
  }
  .anim-controls button {
    background: #333; border: 1px solid #555; color: #ccc; padding: 4px 14px;
    border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px;
    min-width: 60px;
  }
  .anim-controls button.active { background: #6faaff; color: #111; border-color: #6faaff; }
  .anim-frame-num {
    font-size: 13px; color: #ccc; min-width: 70px;
  }
  .anim-speed-group {
    display: flex; align-items: center; gap: 6px;
  }
  .anim-speed-group input[type="range"] {
    width: 120px; accent-color: #6faaff;
  }
  .anim-speed-label {
    font-size: 11px; color: #888; min-width: 55px;
  }

  /* Filmstrip */
  .filmstrip {
    display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px;
  }
  .filmstrip-frame {
    cursor: pointer;
    border: 2px solid transparent;
    border-radius: 3px;
    padding: 2px;
    transition: border-color 0.15s;
    display: flex; flex-direction: column; align-items: center;
  }
  .filmstrip-frame:hover {
    border-color: #555;
  }
  .filmstrip-frame.active {
    border-color: #6faaff;
  }
  .filmstrip-frame .preview-bg {
    line-height: 0;
  }
  .filmstrip-img {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
  .filmstrip-label {
    font-size: 10px; color: #666; margin-top: 2px;
  }
  .filmstrip-frame.active .filmstrip-label {
    color: #6faaff;
  }

  .empty { text-align: center; padding: 60px; color: #666; }

  /* Status badges */
  .status-badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 3px;
    margin-left: 8px; vertical-align: middle; font-weight: bold; text-transform: uppercase;
  }
  .status-unreviewed { background: #4a4a2a; color: #fd0; }
  .status-approved { background: #2a4a2a; color: #8f8; }
  .status-rejected { background: #4a2a2a; color: #f88; }
  .status-needs-changes { background: #4a3a1a; color: #fa8; }

  /* Header summary */
  .summary {
    display: flex; gap: 16px; font-size: 13px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .summary-item { color: #888; }
  .summary-item strong { font-weight: bold; }
  .summary-item.unreviewed strong { color: #fd0; }
  .summary-item.approved strong { color: #8f8; }
  .summary-item.rejected strong { color: #f88; }
  .summary-item.needs-changes strong { color: #fa8; }

  /* Filter bar */
  .filter-bar {
    display: flex; gap: 8px; align-items: center; margin-bottom: 24px;
    font-size: 13px; color: #888;
  }
  .filter-bar button {
    background: #333; border: 1px solid #555; color: #ccc; padding: 6px 16px;
    border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px;
  }
  .filter-bar button.active { background: #6faaff; color: #111; border-color: #6faaff; }
  .filter-bar button:hover:not(.active) { background: #444; }

  /* Card grid */
  .card-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px; margin-bottom: 24px;
  }
  .card {
    background: #16213e; border: 1px solid #333; border-radius: 8px;
    padding: 16px; cursor: pointer; transition: border-color 0.15s, opacity 0.15s;
  }
  .card:hover { border-color: #6faaff; }
  .card.status-dim-approved { opacity: 0.5; }
  .card.status-dim-rejected { opacity: 0.35; }
  .card.status-dim-rejected .card-name { text-decoration: line-through; }
  .card-header { margin-bottom: 12px; }
  .card-name { font-size: 18px; color: #eee; font-weight: bold; margin-bottom: 2px; }
  .card-id { font-size: 12px; color: #6faaff; margin-bottom: 6px; }
  .card-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .card-thumb {
    margin-bottom: 12px; display: flex; justify-content: center;
    min-height: 80px; align-items: center;
  }
  .card-thumb .preview-bg {
    display: inline-block; line-height: 0;
  }
  .card-thumb img {
    image-rendering: pixelated; image-rendering: crisp-edges; display: block;
  }
  .card-notes {
    font-size: 11px; color: #888; line-height: 1.4;
    max-height: 40px; overflow: hidden; text-overflow: ellipsis;
  }

  /* Detail view */
  .detail-back {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: #6faaff; cursor: pointer; margin-bottom: 16px;
    background: none; border: none; font-family: inherit; padding: 0;
  }
  .detail-back:hover { text-decoration: underline; }
</style>
</head>
<body>

<div id="app"></div>

<script>
const app = document.getElementById('app');

// Current background style — shared across all previews
let currentBg = '#111';

async function loadManifest() {
  try {
    const res = await fetch('../pixellab/manifest.json');
    if (!res.ok) throw new Error(`${res.status}`);
    return await res.json();
  } catch (e) {
    app.innerHTML = `<div class="empty">
      <p>No manifest.json found.</p>
      <p style="margin-top:8px">Run: <code>npx tsx workshop/pixellab/build-manifest.ts</code></p>
    </div>`;
    return null;
  }
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function applyBg(el) {
  el.classList.remove('bg-checker');
  if (currentBg === 'checker') {
    el.style.background = '';
    el.classList.add('bg-checker');
  } else {
    el.style.background = currentBg;
  }
}

function applyAllBgs() {
  document.querySelectorAll('.preview-bg').forEach(applyBg);
}

function renderStaticPreview(exp) {
  const framePath = `../pixellab/${exp.id}/${exp.frames[0]}`;
  const zooms = [1, 4, 8];

  let html = `<div class="zoom-row">`;
  for (const z of zooms) {
    html += `<div class="zoom-item">`;
    html += `<span class="zoom-label">${z}x</span>`;
    html += `<div class="preview-bg" style="background: ${currentBg};">`;
    html += `<img class="zoom-img" src="${framePath}" style="width: calc(var(--native-w, 32) * ${z}px); height: calc(var(--native-h, 32) * ${z}px);">`;
    html += `</div></div>`;
  }
  html += `</div>`;
  return html;
}

// Animation state: keyed by exp.id
const animTimers = {};
const animStates = {};

function renderAnimationPreview(exp) {
  const expId = escHtml(exp.id);
  const frameRate = exp.frame_rate || 200;
  const frames = exp.frames.map(f => `../pixellab/${exp.id}/${f}`);
  if (frames.length === 0) {
    return `<div class="placeholder">No frames found</div>`;
  }

  // Store initial state
  animStates[exp.id] = { frame: 0, speed: frameRate, playing: false, frames };

  let html = `<div class="anim-container" data-anim-id="${expId}">`;

  // Main preview image
  html += `<div class="anim-main">`;
  html += `<div class="preview-bg">`;
  html += `<img class="anim-main-img" src="${frames[0]}" data-anim-id="${expId}">`;
  html += `</div>`;
  html += `</div>`;

  // Controls row
  html += `<div class="anim-controls">`;
  html += `<button class="anim-play-btn" data-anim-id="${expId}">Play</button>`;
  html += `<span class="anim-frame-num" data-anim-id="${expId}">Frame 1 / ${frames.length}</span>`;
  html += `<div class="anim-speed-group">`;
  html += `<span>Speed:</span>`;
  html += `<input type="range" class="anim-speed-slider" data-anim-id="${expId}" min="50" max="800" step="10" value="${frameRate}">`;
  html += `<span class="anim-speed-label" data-anim-id="${expId}">${frameRate}ms</span>`;
  html += `</div>`;
  html += `</div>`;

  // Filmstrip
  html += `<div class="filmstrip" data-anim-id="${expId}">`;
  for (let i = 0; i < frames.length; i++) {
    html += `<div class="filmstrip-frame${i === 0 ? ' active' : ''}" data-anim-id="${expId}" data-frame-idx="${i}">`;
    html += `<div class="preview-bg">`;
    html += `<img class="filmstrip-img" src="${frames[i]}" loading="lazy">`;
    html += `</div>`;
    html += `<span class="filmstrip-label">${i + 1}</span>`;
    html += `</div>`;
  }
  html += `</div>`;

  html += `</div>`;
  return html;
}

function setAnimFrame(expId, frameIdx) {
  const state = animStates[expId];
  if (!state) return;
  state.frame = frameIdx;

  // Update main image
  const mainImg = document.querySelector(`.anim-main-img[data-anim-id="${expId}"]`);
  if (mainImg) mainImg.src = state.frames[frameIdx];

  // Update frame number
  const frameNum = document.querySelector(`.anim-frame-num[data-anim-id="${expId}"]`);
  if (frameNum) frameNum.textContent = `Frame ${frameIdx + 1} / ${state.frames.length}`;

  // Update filmstrip active state
  const filmstrip = document.querySelector(`.filmstrip[data-anim-id="${expId}"]`);
  if (filmstrip) {
    filmstrip.querySelectorAll('.filmstrip-frame').forEach(f => f.classList.remove('active'));
    const target = filmstrip.querySelector(`.filmstrip-frame[data-frame-idx="${frameIdx}"]`);
    if (target) target.classList.add('active');
  }
}

function startAnim(expId) {
  const state = animStates[expId];
  if (!state) return;
  state.playing = true;

  function tick() {
    state.frame = (state.frame + 1) % state.frames.length;
    setAnimFrame(expId, state.frame);
  }

  animTimers[expId] = setInterval(tick, state.speed);
}

function stopAnim(expId) {
  if (animTimers[expId]) {
    clearInterval(animTimers[expId]);
    delete animTimers[expId];
  }
  const state = animStates[expId];
  if (state) state.playing = false;
}

function restartAnimTimer(expId) {
  const state = animStates[expId];
  if (!state || !state.playing) return;
  stopAnim(expId);
  state.playing = true;
  animTimers[expId] = setInterval(() => {
    state.frame = (state.frame + 1) % state.frames.length;
    setAnimFrame(expId, state.frame);
  }, state.speed);
}

// Compass layout positions: maps direction names to grid cell indices (0-8 in a 3x3 grid)
// Grid: [NW=0, N=1, NE=2, W=3, center=4, E=5, SW=6, S=7, SE=8]
const COMPASS_POSITIONS = {
  nw: 0, northwest: 0,
  n: 1, north: 1,
  ne: 2, northeast: 2,
  w: 3, west: 3,
  e: 5, east: 5,
  sw: 6, southwest: 6,
  s: 7, south: 7,
  se: 8, southeast: 8,
};

const COMPASS_LABELS = ['NW', 'N', 'NE', 'W', '', 'E', 'SW', 'S', 'SE'];

// Cycle order: clockwise from N
const CYCLE_ORDER_8 = [1, 2, 5, 8, 7, 6, 3, 0]; // N, NE, E, SE, S, SW, W, NW
const CYCLE_ORDER_4 = [1, 5, 7, 3]; // N, E, S, W

function renderDirectionalPreview(exp) {
  const dirMap = exp.direction_map || {};
  const directions = Object.keys(dirMap);
  if (directions.length === 0) {
    return `<div class="placeholder">No direction_map in manifest</div>`;
  }

  // Build 3x3 grid cells
  const cells = new Array(9).fill(null);
  for (const [dir, framePath] of Object.entries(dirMap)) {
    const idx = COMPASS_POSITIONS[dir.toLowerCase()];
    if (idx !== undefined) {
      cells[idx] = { dir, framePath: `../pixellab/${exp.id}/${framePath}` };
    }
  }

  const expIdAttr = escHtml(exp.id);

  let html = `<div class="compass-container" data-exp-id="${expIdAttr}">`;
  html += `<div class="compass-grid">`;
  for (let i = 0; i < 9; i++) {
    const cell = cells[i];
    if (i === 4) {
      // Center cell — empty or could show a dot
      html += `<div class="compass-cell empty"></div>`;
    } else if (cell) {
      html += `<div class="compass-cell" data-cell-idx="${i}">`;
      html += `<span class="compass-label">${COMPASS_LABELS[i]}</span>`;
      html += `<div class="preview-bg">`;
      html += `<img class="compass-img" src="${cell.framePath}" loading="lazy">`;
      html += `</div>`;
      html += `</div>`;
    } else {
      html += `<div class="compass-cell empty"></div>`;
    }
  }
  html += `</div>`;

  // Cycle controls
  html += `<div class="compass-controls">`;
  html += `<button class="cycle-btn" data-exp-id="${expIdAttr}">Cycle</button>`;
  html += `<span class="cycle-status" data-exp-id="${expIdAttr}"></span>`;
  html += `</div>`;
  html += `</div>`;

  return html;
}

// Active cycle timers: keyed by exp.id
const cycleTimers = {};

function startCycle(expId) {
  const container = document.querySelector(`.compass-container[data-exp-id="${expId}"]`);
  if (!container) return;

  const cells = container.querySelectorAll('.compass-cell[data-cell-idx]');
  const cellIndices = Array.from(cells).map(c => parseInt(c.dataset.cellIdx));
  if (cellIndices.length === 0) return;

  // Determine cycle order based on available directions
  const has8 = cellIndices.some(i => [0, 2, 6, 8].includes(i));
  const order = (has8 ? CYCLE_ORDER_8 : CYCLE_ORDER_4).filter(i => cellIndices.includes(i));
  if (order.length === 0) return;

  let step = 0;

  function tick() {
    // Clear all active states
    cells.forEach(c => c.classList.remove('active'));
    // Highlight current
    const targetIdx = order[step % order.length];
    const targetCell = container.querySelector(`.compass-cell[data-cell-idx="${targetIdx}"]`);
    if (targetCell) targetCell.classList.add('active');

    const statusEl = container.querySelector(`.cycle-status[data-exp-id="${expId}"]`);
    if (statusEl) statusEl.textContent = COMPASS_LABELS[targetIdx];

    step++;
  }

  tick(); // immediate first tick
  cycleTimers[expId] = setInterval(tick, 600);
}

function stopCycle(expId) {
  if (cycleTimers[expId]) {
    clearInterval(cycleTimers[expId]);
    delete cycleTimers[expId];
  }
  const container = document.querySelector(`.compass-container[data-exp-id="${expId}"]`);
  if (container) {
    container.querySelectorAll('.compass-cell').forEach(c => c.classList.remove('active'));
    const statusEl = container.querySelector(`.cycle-status[data-exp-id="${expId}"]`);
    if (statusEl) statusEl.textContent = '';
  }
}

// Current view state
let currentFilter = 'all'; // 'all' | 'unreviewed' | 'needs-attention'
let currentView = 'index'; // 'index' | 'detail'
let currentExpId = null;
let manifestData = null;

function statusLabel(status) {
  return (status || 'unreviewed').replace('-', '-');
}

function getStatusCounts(experiments) {
  const counts = { unreviewed: 0, approved: 0, rejected: 0, 'needs-changes': 0 };
  for (const exp of experiments) {
    const s = exp.status || 'unreviewed';
    if (counts[s] !== undefined) counts[s]++;
  }
  return counts;
}

function filterExperiments(experiments, filter) {
  if (filter === 'all') return experiments;
  if (filter === 'unreviewed') return experiments.filter(e => (e.status || 'unreviewed') === 'unreviewed');
  if (filter === 'needs-attention') return experiments.filter(e => {
    const s = e.status || 'unreviewed';
    return s === 'rejected' || s === 'needs-changes';
  });
  return experiments;
}

function cardDimClass(status) {
  const s = status || 'unreviewed';
  if (s === 'approved') return ' status-dim-approved';
  if (s === 'rejected') return ' status-dim-rejected';
  return '';
}

function getCardThumbSrc(exp) {
  if (exp.type === 'static' && exp.frames.length > 0) {
    return `../pixellab/${exp.id}/${exp.frames[0]}`;
  }
  if (exp.type === 'directional' && exp.direction_map) {
    // Use south-facing or first available direction
    const dm = exp.direction_map;
    const src = dm.south || dm.s || dm.east || dm.e || Object.values(dm)[0];
    if (src) return `../pixellab/${exp.id}/${src}`;
  }
  if (exp.type === 'animation' && exp.frames.length > 0) {
    return `../pixellab/${exp.id}/${exp.frames[0]}`;
  }
  return null;
}

function renderIndexPage(manifest) {
  const { experiments } = manifest;
  const counts = getStatusCounts(experiments);

  // Pick default filter: unreviewed if any exist, else all
  if (currentFilter === 'all' && counts.unreviewed > 0 && currentView === 'index') {
    // Only auto-select on first load
    if (!manifestData) currentFilter = 'unreviewed';
  }

  const filtered = filterExperiments(experiments, currentFilter);

  let html = `<h1>Lightbox — Asset Review</h1>`;

  // Summary counts
  html += `<div class="summary">`;
  html += `<span class="summary-item unreviewed"><strong>${counts.unreviewed}</strong> unreviewed</span>`;
  html += `<span class="summary-item approved"><strong>${counts.approved}</strong> approved</span>`;
  html += `<span class="summary-item rejected"><strong>${counts.rejected}</strong> rejected</span>`;
  if (counts['needs-changes'] > 0) {
    html += `<span class="summary-item needs-changes"><strong>${counts['needs-changes']}</strong> needs changes</span>`;
  }
  html += `</div>`;

  // Filter bar
  html += `<div class="filter-bar">Filter:`;
  html += ` <button data-filter="all"${currentFilter === 'all' ? ' class="active"' : ''}>All (${experiments.length})</button>`;
  html += ` <button data-filter="unreviewed"${currentFilter === 'unreviewed' ? ' class="active"' : ''}>Unreviewed (${counts.unreviewed})</button>`;
  const needsAttentionCount = counts.rejected + counts['needs-changes'];
  html += ` <button data-filter="needs-attention"${currentFilter === 'needs-attention' ? ' class="active"' : ''}>Needs Attention (${needsAttentionCount})</button>`;
  html += `</div>`;

  if (filtered.length === 0) {
    html += `<div class="empty">No assets match this filter.</div>`;
    app.innerHTML = html;
    wireFilterButtons();
    return;
  }

  // Card grid
  html += `<div class="card-grid">`;
  for (const exp of filtered) {
    const status = exp.status || 'unreviewed';
    html += `<div class="card${cardDimClass(status)}" data-exp-id="${escHtml(exp.id)}">`;
    html += `<div class="card-header">`;
    html += `<div class="card-name">${escHtml(exp.name)}</div>`;
    html += `<div class="card-id">${escHtml(exp.id)}</div>`;
    html += `<div class="card-badges">`;
    html += `<span class="experiment-type type-${exp.type}">${exp.type}</span>`;
    html += `<span class="status-badge status-${status}">${statusLabel(status)}</span>`;
    html += `</div>`;
    html += `</div>`;

    // Thumbnail
    const thumbSrc = getCardThumbSrc(exp);
    if (thumbSrc) {
      html += `<div class="card-thumb"><div class="preview-bg"><img src="${thumbSrc}" loading="lazy"></div></div>`;
    }

    // Review notes
    const notes = exp.review_notes || exp.notes;
    if (notes) {
      html += `<div class="card-notes">${escHtml(notes)}</div>`;
    }

    html += `</div>`;
  }
  html += `</div>`;

  app.innerHTML = html;

  // Scale card thumbnails to 3x zoom
  document.querySelectorAll('.card-thumb img').forEach(img => {
    function setThumbSize() {
      if (img.naturalWidth && img.naturalHeight) {
        const zoom = 3;
        img.style.width = (img.naturalWidth * zoom) + 'px';
        img.style.height = (img.naturalHeight * zoom) + 'px';
      }
    }
    if (img.complete) setThumbSize();
    else img.addEventListener('load', setThumbSize);
  });

  // Wire filter buttons
  wireFilterButtons();

  // Wire card clicks
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      currentExpId = card.dataset.expId;
      currentView = 'detail';
      renderCurrentView();
    });
  });

  applyAllBgs();
}

function wireFilterButtons() {
  document.querySelectorAll('.filter-bar button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.filter;
      renderCurrentView();
    });
  });
}

function renderDetailPage(manifest) {
  const exp = manifest.experiments.find(e => e.id === currentExpId);
  if (!exp) {
    currentView = 'index';
    renderCurrentView();
    return;
  }

  const status = exp.status || 'unreviewed';

  let html = `<button class="detail-back">&larr; Back to index</button>`;
  html += `<div class="experiment">`;
  html += `<div class="experiment-header">`;
  html += `<span class="experiment-name">${escHtml(exp.name)}</span>`;
  html += `<span class="experiment-type type-${exp.type}">${exp.type}</span>`;
  html += `<span class="status-badge status-${status}">${statusLabel(status)}</span>`;
  html += `<div class="experiment-id">${escHtml(exp.id)}</div>`;
  if (exp.notes) {
    html += `<div class="experiment-notes">${escHtml(exp.notes)}</div>`;
  }
  if (exp.review_notes) {
    html += `<div class="experiment-notes" style="color:#fa8;margin-top:4px;">Review: ${escHtml(exp.review_notes)}</div>`;
  }
  html += `</div>`;

  // Background toggle
  html += `<div class="bg-toggle">Background:`;
  html += ` <button data-bg="#111"${currentBg === '#111' ? ' class="active"' : ''}>Dark</button>`;
  html += ` <button data-bg="#888"${currentBg === '#888' ? ' class="active"' : ''}>Gray</button>`;
  html += ` <button data-bg="#eee"${currentBg === '#eee' ? ' class="active"' : ''}>Light</button>`;
  html += ` <button data-bg="checker"${currentBg === 'checker' ? ' class="active"' : ''}>Checker</button>`;
  html += `</div>`;

  if (exp.type === 'static') {
    html += renderStaticPreview(exp);
  } else if (exp.type === 'directional') {
    html += renderDirectionalPreview(exp);
  } else if (exp.type === 'animation') {
    html += renderAnimationPreview(exp);
  } else {
    html += `<div class="placeholder">Unknown type: ${escHtml(exp.type)}</div>`;
  }

  html += `</div>`;
  app.innerHTML = html;

  // Wire back button
  document.querySelector('.detail-back').addEventListener('click', () => {
    // Stop any running timers
    Object.keys(cycleTimers).forEach(stopCycle);
    Object.keys(animTimers).forEach(stopAnim);
    currentView = 'index';
    renderCurrentView();
  });

  // Wire background toggle
  document.querySelectorAll('.bg-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.bg-toggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentBg = btn.dataset.bg;
      applyAllBgs();
    });
  });

  // Post-render image sizing (same logic as before, scoped to the single detail experiment)

  // Static zoom images
  document.querySelectorAll('.zoom-img').forEach(img => {
    const item = img.closest('.zoom-item');
    if (!item) return;
    function setSize() {
      if (img.naturalWidth && img.naturalHeight) {
        const z = parseInt(item.querySelector('.zoom-label').textContent);
        img.style.width = (img.naturalWidth * z) + 'px';
        img.style.height = (img.naturalHeight * z) + 'px';
      }
    }
    if (img.complete) setSize();
    else img.addEventListener('load', setSize);
  });

  // Compass images
  document.querySelectorAll('.compass-container').forEach(container => {
    const imgs = container.querySelectorAll('.compass-img');
    if (imgs.length === 0) return;
    const first = imgs[0];
    function setCompassSizes() {
      if (first.naturalWidth && first.naturalHeight) {
        const zoom = 4;
        imgs.forEach(img => {
          img.style.width = (first.naturalWidth * zoom) + 'px';
          img.style.height = (first.naturalHeight * zoom) + 'px';
        });
      }
    }
    if (first.complete) setCompassSizes();
    else first.addEventListener('load', setCompassSizes);
  });

  // Wire cycle buttons
  document.querySelectorAll('.cycle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const expId = btn.dataset.expId;
      if (btn.classList.contains('active')) {
        btn.classList.remove('active');
        btn.textContent = 'Cycle';
        stopCycle(expId);
      } else {
        btn.classList.add('active');
        btn.textContent = 'Stop';
        startCycle(expId);
      }
    });
  });

  // Animation sizing
  document.querySelectorAll('.anim-container').forEach(container => {
    const mainImg = container.querySelector('.anim-main-img');
    const filmImgs = container.querySelectorAll('.filmstrip-img');
    function setAnimSizes() {
      if (mainImg.naturalWidth && mainImg.naturalHeight) {
        mainImg.style.width = (mainImg.naturalWidth * 4) + 'px';
        mainImg.style.height = (mainImg.naturalHeight * 4) + 'px';
        filmImgs.forEach(img => {
          img.style.width = (mainImg.naturalWidth * 2) + 'px';
          img.style.height = (mainImg.naturalHeight * 2) + 'px';
        });
      }
    }
    if (mainImg && mainImg.complete) setAnimSizes();
    else if (mainImg) mainImg.addEventListener('load', setAnimSizes);
  });

  // Wire animation controls
  document.querySelectorAll('.anim-play-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const expId = btn.dataset.animId;
      const state = animStates[expId];
      if (!state) return;
      if (state.playing) {
        stopAnim(expId);
        btn.classList.remove('active');
        btn.textContent = 'Play';
      } else {
        startAnim(expId);
        btn.classList.add('active');
        btn.textContent = 'Pause';
      }
    });
  });

  document.querySelectorAll('.anim-speed-slider').forEach(slider => {
    slider.addEventListener('input', () => {
      const expId = slider.dataset.animId;
      const state = animStates[expId];
      if (!state) return;
      state.speed = parseInt(slider.value);
      const label = document.querySelector(`.anim-speed-label[data-anim-id="${expId}"]`);
      if (label) label.textContent = state.speed + 'ms';
      if (state.playing) restartAnimTimer(expId);
    });
  });

  document.querySelectorAll('.filmstrip-frame').forEach(frame => {
    frame.addEventListener('click', () => {
      setAnimFrame(frame.dataset.animId, parseInt(frame.dataset.frameIdx));
    });
  });

  applyAllBgs();
}

function renderCurrentView() {
  if (!manifestData) return;
  // Clean up timers when switching views
  Object.keys(cycleTimers).forEach(stopCycle);
  Object.keys(animTimers).forEach(stopAnim);

  if (currentView === 'detail' && currentExpId) {
    renderDetailPage(manifestData);
  } else {
    renderIndexPage(manifestData);
  }
}

(async () => {
  const manifest = await loadManifest();
  if (!manifest) return;

  // Set default filter based on unreviewed count
  const counts = getStatusCounts(manifest.experiments);
  currentFilter = counts.unreviewed > 0 ? 'unreviewed' : 'all';

  manifestData = manifest;
  renderCurrentView();
})();
</script>
</body>
</html>
